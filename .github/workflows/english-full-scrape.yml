# Exhaustive scrape of all MySchool English questions for JAMB and WAEC.
#
# - JAMB: use-of-english (source english-language) across all configured years.
# - WAEC: english-language across all configured years for the selected country.
#
# WAEC runs after JAMB completes. Each year is scraped independently and the
# run continues across years so missing coverage can be retried idempotently.

name: english-full-scrape

run-name: >-
  English full scrape (JAMB ${{ inputs.jamb_start_year }}-${{ inputs.jamb_end_year }},
  WAEC ${{ inputs.waec_start_year }}-${{ inputs.waec_end_year }} ${{ inputs.country }})

on:
  workflow_dispatch:
    inputs:
      jamb_start_year:
        description: "First JAMB year to scrape"
        type: string
        required: true
        default: "1970"
      jamb_end_year:
        description: "Last JAMB year to scrape"
        type: string
        required: true
        default: "2026"
      waec_start_year:
        description: "First WAEC year to scrape"
        type: string
        required: true
        default: "1980"
      waec_end_year:
        description: "Last WAEC year to scrape"
        type: string
        required: true
        default: "2026"
      country:
        description: "WAEC country code"
        type: string
        required: true
        default: "NG"
      limit:
        description: "Maximum valid source rows per year"
        type: string
        required: true
        default: "10000"
      max_failures:
        description: "Stop a year after this many consecutive failures (0 = no cap)"
        type: string
        required: true
        default: "0"

concurrency:
  group: english-full-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  jamb-english:
    name: JAMB use-of-english
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TURSO_PROD_DATABASE_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_PROD_AUTH_TOKEN_READONLY: ${{ secrets.TURSO_DB_TOKEN_READONLY }}
      TURSO_BANK_DATABASE_SECOND_URL: ${{ secrets.TURSO_BANK_DATABASE_SECOND_URL }}
      TURSO_BANK_AUTH_SECOND_TOKEN: ${{ secrets.TURSO_BANK_AUTH_SECOND_TOKEN }}
      TURSO_BANK_DATABASE_URL: ${{ secrets.TURSO_BANK_DATABASE_SECOND_URL }}
      TURSO_BANK_AUTH_TOKEN: ${{ secrets.TURSO_BANK_AUTH_SECOND_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      GITLAB_MEDIA_REPO: shedrackgodstime/utmelab-bank
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the bank
        working-directory: utmelab-bank
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scrape all JAMB use-of-english years
        working-directory: utmelab-bank
        env:
          START_YEAR: ${{ inputs.jamb_start_year }}
          END_YEAR: ${{ inputs.jamb_end_year }}
          LIMIT: ${{ inputs.limit }}
          MAX_FAILURES: ${{ inputs.max_failures }}
        run: |
          set -euo pipefail
          failures=0
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            echo "::group::JAMB use-of-english $year"
            if utmelab-bank scrape \
              --source myschool \
              --exam JAMB \
              --subject use-of-english \
              --year "$year" \
              --limit "$LIMIT" \
              --max-failures "$MAX_FAILURES"; then
              echo "JAMB use-of-english $year: ok"
            else
              rc=$?
              echo "JAMB use-of-english $year: failed (exit $rc)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures JAMB year run(s) failed"
            exit 1
          fi

  waec-english:
    name: WAEC english-language
    runs-on: ubuntu-latest
    needs: jamb-english
    timeout-minutes: 360
    env:
      TURSO_PROD_DATABASE_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_PROD_AUTH_TOKEN_READONLY: ${{ secrets.TURSO_DB_TOKEN_READONLY }}
      TURSO_BANK_DATABASE_SECOND_URL: ${{ secrets.TURSO_BANK_DATABASE_SECOND_URL }}
      TURSO_BANK_AUTH_SECOND_TOKEN: ${{ secrets.TURSO_BANK_AUTH_SECOND_TOKEN }}
      TURSO_BANK_DATABASE_URL: ${{ secrets.TURSO_BANK_DATABASE_SECOND_URL }}
      TURSO_BANK_AUTH_TOKEN: ${{ secrets.TURSO_BANK_AUTH_SECOND_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      GITLAB_MEDIA_REPO: shedrackgodstime/utmelab-bank
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the bank
        working-directory: utmelab-bank
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Scrape all WAEC english-language years
        working-directory: utmelab-bank
        env:
          START_YEAR: ${{ inputs.waec_start_year }}
          END_YEAR: ${{ inputs.waec_end_year }}
          COUNTRY: ${{ inputs.country }}
          LIMIT: ${{ inputs.limit }}
          MAX_FAILURES: ${{ inputs.max_failures }}
        run: |
          set -euo pipefail
          failures=0
          for year in $(seq "$START_YEAR" "$END_YEAR"); do
            echo "::group::WAEC english-language $COUNTRY $year"
            if utmelab-bank scrape \
              --source myschool \
              --exam WAEC \
              --subject english-language \
              --year "$year" \
              --country "$COUNTRY" \
              --limit "$LIMIT" \
              --max-failures "$MAX_FAILURES"; then
              echo "WAEC english-language $COUNTRY $year: ok"
            else
              rc=$?
              echo "WAEC english-language $COUNTRY $year: failed (exit $rc)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures WAEC year run(s) failed"
            exit 1
          fi
